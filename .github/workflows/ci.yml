name: CI

# Checks only. Webslice deploys from its own webhook, so nothing here deploys.
# The point is that a broken starter never reaches someone who clones it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Matches composer.json. Use this or newer for the Console runtime.
          php-version: '8.3'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Build assets
        run: npm run build

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      # A syntax error here fails the deploy with no useful message, and only
      # once the site is already being replaced.
      - name: Check the deploy scripts parse
        run: |
          bash -n .webslice/build.sh
          bash -n .webslice/release.sh

      # Nothing errors if these go missing; the site just quietly gets slower
      # and more expensive.
      - name: Check the static caching rewrite is present
        run: grep -q 'DOCUMENT_ROOT}/static' public/.htaccess

      - name: Check the deploy scripts are executable
        run: |
          test -x .webslice/build.sh
          test -x .webslice/release.sh
