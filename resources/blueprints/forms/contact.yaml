title: Contact
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: name
            field:
              type: text
              display: Name
              validate:
                - required
                - 'max:100'
          -
            handle: email
            field:
              type: text
              display: Email
              input_type: email
              validate:
                - required
                - email
          -
            handle: message
            field:
              type: textarea
              display: Message
              validate:
                - required
                - 'max:5000'
